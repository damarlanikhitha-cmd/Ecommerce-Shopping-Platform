{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        👤 My Profile
                    </h2>


                    <!-- PROFILE PICTURE -->

                    <div class="text-center mb-4">

                        {% if profile.profile_image %}

                            <img src="{{ profile.profile_image.url }}"
                                 alt="Profile Picture"
                                 width="120"
                                 height="120"
                                 class="rounded-circle border"
                                 style="object-fit: cover;">

                        {% else %}

                            <div class="rounded-circle bg-light border d-flex align-items-center justify-content-center mx-auto"
                                 style="width:120px; height:120px;">

                                <span style="font-size:50px;">👤</span>

                            </div>

                        {% endif %}

                    </div>


                    <!-- ACCOUNT INFORMATION -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text"
                               class="form-control"
                               value="{{ request.user.username }}"
                               readonly>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               value="{{ request.user.email }}"
                               readonly>

                    </div>


                    <!-- UPDATE FORM -->

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                class="form-control"
                                value="{{ request.user.first_name }}"
                                placeholder="Enter your full name">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ profile.phone }}"
                                placeholder="Enter phone number">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="3"
                                placeholder="Enter your address">{{ profile.address }}</textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Change Profile Picture
                            </label>

                            <input
                                type="file"
                                name="profile_image"
                                class="form-control"
                                accept="image/*">

                        </div>


                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary">
                                Update Profile
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
